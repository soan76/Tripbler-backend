spring.application.name=tripbler-backend

server.port=8080
server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://localhost:5432/tripbler
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration-seconds=3600
security.refresh-token.expiration-days=14

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

profile-image.storage.local-root=${PROFILE_IMAGE_LOCAL_ROOT:./uploads}
profile-image.storage.public-base-url=${PROFILE_IMAGE_PUBLIC_BASE_URL:http://localhost:8080/uploads}
profile-image.storage.type=${PROFILE_IMAGE_STORAGE_TYPE:local}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB